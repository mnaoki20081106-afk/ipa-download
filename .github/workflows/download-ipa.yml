name: Download iOS IPA

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'App StoreのURL (例: https://apps.apple.com/jp/app/.../id123456789)'
        required: true
        type: string

jobs:
  download:
    runs-on: macos-latest
    steps:
      - name: URLからBundle IDを抽出
        id: extract
        run: |
          # URLから "id" に続く数字(App ID)を抽出
          APP_ID=$(echo "${{ inputs.app_url }}" | grep -o 'id[0-9]*' | cut -c 3-)
          if [ -z "$APP_ID" ]; then
            echo "エラー: 有効なApp Store URLではありません"
            exit 1
          fi
          
          # iTunes APIを使用してBundle IDを取得
          BUNDLE_ID=$(curl -s "https://itunes.apple.com/lookup?id=$APP_ID" | jq -r '.results[0].bundleId')
          
          if [ "$BUNDLE_ID" == "null" ] || [ -z "$BUNDLE_ID" ]; then
            echo "エラー: Bundle IDの取得に失敗しました"
            exit 1
          fi
          
          echo "bundle_id=$BUNDLE_ID" >> $GITHUB_ENV
          echo "App ID: $APP_ID"
          echo "Bundle ID: $BUNDLE_ID"

      - name: ipatoolのインストール
        run: |
          brew tap majd/repo
          brew install ipatool

      - name: Apple IDで認証
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: ipatool auth login -e "$APPLE_ID" -p "$APPLE_PASSWORD"

      - name: IPAのダウンロード
        run: |
          # 無料アプリで未購入の場合は --purchase フラグで取得
          ipatool download -b ${{ env.bundle_id }} --purchase -o app.ipa

      - name: IPAファイルをArtifactにアップロード
        uses: actions/upload-artifact@v4
        with:
          name: Downloaded-IPA
          path: app.ipa
          retention-days: 1
