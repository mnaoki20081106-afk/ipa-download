name: Download iOS IPA

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'App StoreのURL'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: URLからBundle IDを抽出
        id: extract
        run: |
          APP_ID=$(echo "${{ inputs.app_url }}" | grep -o 'id[0-9]*' | cut -c 3-)
          # ▼ 日本のApp Storeから検索するように /jp/ を追加 ▼
          BUNDLE_ID=$(curl -s "https://itunes.apple.com/jp/lookup?id=$APP_ID" | jq -r '.results[0].bundleId')
          echo "bundle_id=$BUNDLE_ID" >> $GITHUB_ENV

      - name: ipatoolのインストール
        run: |
          ASSET_URL=$(curl -s https://api.github.com/repos/majd/ipatool/releases/latest | jq -r '.assets[] | select(.name | endswith("linux-amd64.tar.gz")) | .browser_download_url')
          mkdir -p ipatool_temp
          curl -L "$ASSET_URL" | tar xz -C ipatool_temp
          find ipatool_temp -type f -size +1M -exec sudo mv {} /usr/local/bin/ipatool \;
          sudo chmod +x /usr/local/bin/ipatool
          rm -rf ipatool_temp

      - name: 認証データ（金庫）の安全な復元
        run: |
          cd ~/
          if [ -z "${{ secrets.IPATOOL_KEYCHAIN }}" ]; then
            echo "エラー: シークレットが空っぽです"
            exit 1
          fi
          # 改行や空白のノイズを強制除去して解凍
          echo "${{ secrets.IPATOOL_KEYCHAIN }}" | tr -d '\n\r ' | base64 -d > auth_bundle.tar.gz
          tar -xzf auth_bundle.tar.gz

      - name: IPAのダウンロード
        run: |
          # ▼ 「-c JP」を追記して、日本のApp Storeを指定 ▼
          ipatool download -b ${{ env.bundle_id }} -c JP --purchase -o app.ipa --non-interactive --keychain-passphrase "123456"

      - name: IPAファイルを保存
        uses: actions/upload-artifact@v4
        with:
          name: Downloaded-IPA
          path: app.ipa
          retention-days: 1
