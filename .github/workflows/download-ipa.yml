name: Download iOS IPA to Release

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'App StoreのURL'
        required: true
        type: string

# Release作成のための権限を付与
permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: URLからBundle IDを抽出
        id: extract
        run: |
          APP_ID=$(echo "${{ inputs.app_url }}" | grep -oE 'id[0-9]+' | sed 's/id//')
          BUNDLE_ID=$(curl -s "https://itunes.apple.com/jp/lookup?id=$APP_ID" | jq -r '.results[0].bundleId')
          echo "bundle_id=$BUNDLE_ID" >> $GITHUB_ENV

      - name: ipatoolのインストール
        run: |
          ASSET_URL=$(curl -s https://api.github.com/repos/majd/ipatool/releases/latest | jq -r '.assets[] | select(.name | endswith("linux-amd64.tar.gz")) | .browser_download_url')
          mkdir -p ipatool_temp
          curl -L "$ASSET_URL" | tar xz -C ipatool_temp
          find ipatool_temp -type f -size +1M -exec sudo mv {} /usr/local/bin/ipatool \;
          sudo chmod +x /usr/local/bin/ipatool
          rm -rf ipatool_temp

      - name: 認証データ（金庫）の復元
        run: |
          cd ~/
          echo "${{ secrets.IPATOOL_KEYCHAIN }}" | tr -d '\n\r ' | base64 -d > auth_bundle.tar.gz
          tar -xzf auth_bundle.tar.gz

      - name: IPAのダウンロード
        run: |
          ipatool download --bundle-identifier "${{ env.bundle_id }}" --purchase --output app.ipa --non-interactive --keychain-passphrase "123456"

      - name: GitHub Releaseへアップロード
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "ipa-${{ github.run_id }}"
          name: "Downloaded IPA: ${{ env.bundle_id }}"
          files: app.ipa
