name: Download iOS IPA

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'App StoreのURL'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: URLからBundle IDを抽出
        id: extract
        run: |
          APP_ID=$(echo "${{ inputs.app_url }}" | grep -o 'id[0-9]*' | cut -c 3-)
          BUNDLE_ID=$(curl -s "https://itunes.apple.com/lookup?id=$APP_ID" | jq -r '.results[0].bundleId')
          echo "bundle_id=$BUNDLE_ID" >> $GITHUB_ENV

      - name: ipatoolのインストール
        run: |
          ASSET_URL=$(curl -s https://api.github.com/repos/majd/ipatool/releases/latest | jq -r '.assets[] | select(.name | endswith("linux-amd64.tar.gz")) | .browser_download_url')
          mkdir -p ipatool_temp
          curl -L "$ASSET_URL" | tar xz -C ipatool_temp
          find ipatool_temp -type f -size +1M -exec sudo mv {} /usr/local/bin/ipatool \;
          sudo chmod +x /usr/local/bin/ipatool
          rm -rf ipatool_temp

      - name: 認証データ（金庫）のまるごと復元
        run: |
          cd ~/
          # 長い文字列が途切れないように一度ファイルに書き出し、不要な改行を無視(-i)して復元する
          echo "${{ secrets.IPATOOL_KEYCHAIN }}" > auth_bundle.b64
          base64 -d -i auth_bundle.b64 > auth_bundle.tar.gz
          tar -xzf auth_bundle.tar.gz

      - name: IPAのダウンロード
        run: |
          echo "123456" | ipatool download -b ${{ env.bundle_id }} --purchase -o app.ipa

      - name: IPAファイルを保存
        uses: actions/upload-artifact@v4
        with:
          name: Downloaded-IPA
          path: app.ipa
          retention-days: 1
