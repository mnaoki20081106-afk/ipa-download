name: 2. Download IPA via App Store URL

on:
  workflow_dispatch:
    inputs:
      app_store_url:
        description: 'App StoreのURL'
        required: true
        type: string

jobs:
  download:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # URLから「idXXXXX」の数字部分を抽出
      - name: Extract App ID from URL
        id: extract_id
        run: |
          URL="${{ github.event.inputs.app_store_url }}"
          if [[ $URL =~ id([0-9]+) ]]; then
            APP_ID="${BASH_REMATCH}"
            echo "app_id=$APP_ID" >> $GITHUB_OUTPUT
          else
            echo "Error: URLからApp IDを検出できませんでした。"
            exit 1
          fi

      # Base64トークンをデコードしてダウンロードを実行
      - name: Download IPA using Token
        env:
          BASE64_TOKEN: ${{ secrets.IPATOOL_TOKEN }}
          APP_ID: ${{ steps.extract_id.outputs.app_id }}
        run: |
          brew install ipatool
          
          # SecretsのBase64をデコードして環境変数にセット
          export IPATOOL_TOKEN=$(echo "$BASE64_TOKEN" | base64 --decode)
          
          # トークンがあるのでログイン処理を飛ばして直接ダウンロード可能
          ipatool download --app-id "$APP_ID"

      # IPAファイルを保存
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-app-ipa
          path: '*.ipa'
