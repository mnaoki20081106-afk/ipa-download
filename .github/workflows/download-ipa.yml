name: Download IPA via App Store URL

on:
  workflow_dispatch:
    inputs:
      app_store_url:
        description: 'App StoreのURLを入力してください (例: https://apple.com)'
        required: true
        type: string

jobs:
  download:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # URLから「idXXXXX」の数字部分を抽出するステップ
      - name: Extract App ID from URL
        id: extract_id
        run: |
          URL="${{ github.event.inputs.app_store_url }}"
          # 正規表現で「id」の直後にある数字を抽出
          if [[ $URL =~ id([0-9]+) ]]; then
            APP_ID="${BASH_REMATCH[1]}"
            echo "Extracted App ID: $APP_ID"
            echo "app_id=$APP_ID" >> $GITHUB_OUTPUT
          else
            echo "Error: URLからApp IDを検出できませんでした。"
            exit 1
          fi

      # 抽出したApp IDを使ってダウンロードを実行
      # ※ submodules/ipatool-action の代わりに汎用コマンドで実行させています
      - name: Download IPA using IPATool
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APP_ID: ${{ steps.extract_id.outputs.app_id }}
        run: |
          brew install ipatool
          # 非インタラクティブモードで認証して直接ダウンロード
          ipatool download --non-interactive --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --app-id "$APP_ID"

      # ダウンロードされたIPAファイルをArtifactsに保存
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-app-ipa
          path: '*.ipa'
